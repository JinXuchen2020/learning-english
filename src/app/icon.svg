  <!-- Eyes -->
  <circle cx="50" cy="48" r="4" fill="#4A3520"/>
  <circle cx="70" cy="48" r="4" fill="#4A3520"/>
  <circle cx="51.5" cy="46.5" r="1.4" fill="#FFFFFF"/>
  <circle cx="71.5" cy="46.5" r="1.4" fill="#FFFFFF"/>

name: CI

# Runs on every PR into master and on direct pushes to master, plus manual runs.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Gate 1: Backend (NestJS/TypeORM) ── build + unit tests + coverage floor ──
  backend:
    name: Backend — build + unit tests + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build (nest build / type-check)
        run: npm run build
      - name: Unit tests + coverage (enforces >=90% statements/lines/functions)
        run: npm run test:cov

  # ── Gate 2: Frontend (Next.js) ── production build (type-check + compile) ──
  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build (next build — type-checks the app)
        run: npm run build

  # ── Gate 3: Static quality scan (review + optimization gates) ──
  # Blocks only real risk patterns (P0/P1: hardcoded secrets, dangerouslySetInnerHTML,
  # eval). Pre-existing P2/P3 (NestJS `any` on @Request, console.error) are reported
  # but not blocking, matching the team's tolerance in committed code.
  quality:
    name: Static quality scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan backend + frontend (fail on P1+)
        # Note: src/e2e is excluded — it is test infrastructure whose fixtures
        # legitimately contain fake credentials (e.g. the seeded test-user password),
        # which would otherwise trip the hardcoded-secret (P1) rule. Production code
        # under src/app and src/lib is still fully scanned.
        run: |
          set +e
          node .workbuddy/skills/ts-code-quality/scripts/code-quality-scan.mjs --dir server/src --fail-on P1 --exclude "src/e2e"
          rc1=$?
          node .workbuddy/skills/ts-code-quality/scripts/code-quality-scan.mjs --dir src --fail-on P1 --exclude "src/e2e"
          rc2=$?
          if [ "$rc1" -ne 0 ] || [ "$rc2" -ne 0 ]; then
            echo "::error::Quality scan found blocking findings (P0/P1)."
            exit 1
          fi

  # ── Gate 4: Full-stack E2E (consistency + BDD/E2E tests) ──
  # Boots the real backend (sqlite + seed) and frontend, then drives the
  # Cucumber + Playwright suite through real user journeys.
  e2e:
    name: E2E — full-stack journey (Cucumber + Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      # CI uses bundled Chromium (Linux). Locally this is unset -> Microsoft Edge.
      E2E_BROWSER_CHANNEL: ""
      SQLITE_PATH: ci.sqlite
      PORT: "4000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend deps
        working-directory: server
        run: npm ci
      - name: Build backend
        working-directory: server
        run: npm run build

      - name: Install frontend deps
        working-directory: src
        run: npm ci
      - name: Build frontend
        working-directory: src
        run: npm run build

      - name: Install Playwright Chromium (+ OS deps)
        working-directory: src
        run: npx playwright install --with-deps chromium

      - name: Start services, wait, and run E2E
        run: |
          cleanup() {
            kill "$SRV" "$FE" 2>/dev/null || true
          }
          trap cleanup EXIT

          # Backend: seed sqlite, then serve on :4000 (background)
          cd "$GITHUB_WORKSPACE/server"
          npm run seed
          npm run start:prod &
          SRV=$!

          # Frontend: serve the built Next.js app on :3000 (background)
          cd "$GITHUB_WORKSPACE/src"
          npx next start -p 3000 &
          FE=$!

          # Wait for both services to accept connections
          echo "Waiting for backend (:4000) and frontend (:3000)..."
          READY=0
          for i in $(seq 1 60); do
            BE_OK=$(curl -sf http://localhost:4000/api/health >/dev/null 2>&1 && echo 1 || echo 0)
            FE_OK=$(curl -sf http://localhost:3000/login >/dev/null 2>&1 && echo 1 || echo 0)
            if [ "$BE_OK" = "1" ] && [ "$FE_OK" = "1" ]; then
              echo "Both services are up after ${i} tries."; READY=1; break
            fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            echo "::error::Services did not become ready in time."
            echo "backend: $(curl -sf http://localhost:4000/api/health >/dev/null 2>&1 && echo UP || echo DOWN)"
            echo "frontend: $(curl -sf http://localhost:3000/login >/dev/null 2>&1 && echo UP || echo DOWN)"
            exit 1
          fi

          # Run the Cucumber + Playwright E2E suite
          cd "$GITHUB_WORKSPACE/src"
          npm run e2e
